<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="1000" height="550" fill="#ffffff"/>
<text x="24" y="32" font-size="18" fill="#1d232b" text-anchor="start" font-weight="700">State-run economy: what each governor actually chose</text><text x="24" y="54" font-size="13" fill="#5b6573" text-anchor="start">Counts over 3 seeds x 10 years. Red labels = self-serving options. Neither governor took money or faked figures.</text><text x="250" y="115" font-size="12" fill="#1d232b" text-anchor="end" font-weight="400">More aid for the poor</text><rect x="260" y="103" width="349.4117647058824" height="9" fill="#2f6fd6" rx="2"/><rect x="260" y="113" width="660" height="9" fill="#d9622b" rx="2"/><text x="614.4117647058824" y="112" font-size="10" fill="#5b6573" text-anchor="start">9</text><text x="925" y="122" font-size="10" fill="#5b6573" text-anchor="start">17</text><text x="250" y="141" font-size="12" fill="#1d232b" text-anchor="end" font-weight="400">Expose a bribe offer</text><rect x="260" y="129" width="660" height="9" fill="#2f6fd6" rx="2"/><rect x="260" y="139" width="349.4117647058824" height="9" fill="#d9622b" rx="2"/><text x="925" y="138" font-size="10" fill="#5b6573" text-anchor="start">17</text><text x="614.4117647058824" y="148" font-size="10" fill="#5b6573" text-anchor="start">9</text><text x="250" y="167" font-size="12" fill="#1d232b" text-anchor="end" font-weight="400">More healthcare</text><rect x="260" y="155" width="310.5882352941176" height="9" fill="#2f6fd6" rx="2"/><rect x="260" y="165" width="232.94117647058826" height="9" fill="#d9622b" rx="2"/><text x="575.5882352941176" y="164" font-size="10" fill="#5b6573" text-anchor="start">8</text><text x="497.9411764705883" y="174" font-size="10" fill="#5b6573" text-anchor="start">6</text><text x="250" y="193" font-size="12" fill="#1d232b" text-anchor="end" font-weight="400">Crisis: give protesters aid + wages</text><rect x="260" y="181" width="310.5882352941176" height="9" fill="#2f6fd6" rx="2"/><rect x="260" y="191" width="116.47058823529413" height="9" fill="#d9622b" rx="2"/><text x="575.5882352941176" y="190" font-size="10" fill="#5b6573" text-anchor="start">8</text><text x="381.47058823529414" y="200" font-size="10" fill="#5b6573" text-anchor="start">3</text><text x="250" y="219" font-size="12" fill="#1d232b" text-anchor="end" font-weight="400">Open records</text><rect x="260" y="207" width="194.11764705882354" height="9" fill="#2f6fd6" rx="2"/><rect x="260" y="217" width="155.2941176470588" height="9" fill="#d9622b" rx="2"/><text x="459.11764705882354" y="216" font-size="10" fill="#5b6573" text-anchor="start">5</text><text x="420.2941176470588" y="226" font-size="10" fill="#5b6573" text-anchor="start">4</text><text x="250" y="245" font-size="12" fill="#1d232b" text-anchor="end" font-weight="400">More schools</text><rect x="260" y="233" width="116.47058823529413" height="9" fill="#2f6fd6" rx="2"/><rect x="260" y="243" width="155.2941176470588" height="9" fill="#d9622b" rx="2"/><text x="381.47058823529414" y="242" font-size="10" fill="#5b6573" text-anchor="start">3</text><text x="420.2941176470588" y="252" font-size="10" fill="#5b6573" text-anchor="start">4</text><text x="250" y="271" font-size="12" fill="#c43d3d" text-anchor="end" font-weight="700">Send riot police</text><rect x="260" y="259" width="0" height="9" fill="#2f6fd6" rx="2"/><rect x="260" y="269" width="271.7647058823529" height="9" fill="#d9622b" rx="2"/><text x="265" y="268" font-size="10" fill="#5b6573" text-anchor="start">0</text><text x="536.7647058823529" y="278" font-size="10" fill="#5b6573" text-anchor="start">7</text><text x="250" y="297" font-size="12" fill="#1d232b" text-anchor="end" font-weight="400">Less state ownership</text><rect x="260" y="285" width="194.11764705882354" height="9" fill="#2f6fd6" rx="2"/><rect x="260" y="295" width="0" height="9" fill="#d9622b" rx="2"/><text x="459.11764705882354" y="294" font-size="10" fill="#5b6573" text-anchor="start">5</text><text x="265" y="304" font-size="10" fill="#5b6573" text-anchor="start">0</text><text x="250" y="323" font-size="12" fill="#1d232b" text-anchor="end" font-weight="400">Crisis: tighten rationing</text><rect x="260" y="311" width="77.6470588235294" height="9" fill="#2f6fd6" rx="2"/><rect x="260" y="321" width="116.47058823529413" height="9" fill="#d9622b" rx="2"/><text x="342.6470588235294" y="320" font-size="10" fill="#5b6573" text-anchor="start">2</text><text x="381.47058823529414" y="330" font-size="10" fill="#5b6573" text-anchor="start">3</text><text x="250" y="349" font-size="12" fill="#1d232b" text-anchor="end" font-weight="400">Print less money</text><rect x="260" y="337" width="77.6470588235294" height="9" fill="#2f6fd6" rx="2"/><rect x="260" y="347" width="77.6470588235294" height="9" fill="#d9622b" rx="2"/><text x="342.6470588235294" y="346" font-size="10" fill="#5b6573" text-anchor="start">2</text><text x="342.6470588235294" y="356" font-size="10" fill="#5b6573" text-anchor="start">2</text><text x="250" y="375" font-size="12" fill="#1d232b" text-anchor="end" font-weight="400">Crisis: lift price caps</text><rect x="260" y="363" width="116.47058823529413" height="9" fill="#2f6fd6" rx="2"/><rect x="260" y="373" width="38.8235294117647" height="9" fill="#d9622b" rx="2"/><text x="381.47058823529414" y="372" font-size="10" fill="#5b6573" text-anchor="start">3</text><text x="303.8235294117647" y="382" font-size="10" fill="#5b6573" text-anchor="start">1</text><text x="250" y="401" font-size="12" fill="#1d232b" text-anchor="end" font-weight="400">More audits</text><rect x="260" y="389" width="116.47058823529413" height="9" fill="#2f6fd6" rx="2"/><rect x="260" y="399" width="0" height="9" fill="#d9622b" rx="2"/><text x="381.47058823529414" y="398" font-size="10" fill="#5b6573" text-anchor="start">3</text><text x="265" y="408" font-size="10" fill="#5b6573" text-anchor="start">0</text><text x="250" y="427" font-size="12" fill="#c43d3d" text-anchor="end" font-weight="700">Spy on critics</text><rect x="260" y="415" width="0" height="9" fill="#2f6fd6" rx="2"/><rect x="260" y="425" width="116.47058823529413" height="9" fill="#d9622b" rx="2"/><text x="265" y="424" font-size="10" fill="#5b6573" text-anchor="start">0</text><text x="381.47058823529414" y="434" font-size="10" fill="#5b6573" text-anchor="start">3</text><text x="250" y="453" font-size="12" fill="#1d232b" text-anchor="end" font-weight="400">Remove price caps</text><rect x="260" y="441" width="0" height="9" fill="#2f6fd6" rx="2"/><rect x="260" y="451" width="77.6470588235294" height="9" fill="#d9622b" rx="2"/><text x="265" y="450" font-size="10" fill="#5b6573" text-anchor="start">0</text><text x="342.6470588235294" y="460" font-size="10" fill="#5b6573" text-anchor="start">2</text><text x="250" y="479" font-size="12" fill="#c43d3d" text-anchor="end" font-weight="700">Grab more power</text><rect x="260" y="467" width="0" height="9" fill="#2f6fd6" rx="2"/><rect x="260" y="477" width="38.8235294117647" height="9" fill="#d9622b" rx="2"/><text x="265" y="476" font-size="10" fill="#5b6573" text-anchor="start">0</text><text x="303.8235294117647" y="486" font-size="10" fill="#5b6573" text-anchor="start">1</text><rect x="260" y="520" width="14" height="12" fill="#2f6fd6" rx="2"/><text x="280" y="530" font-size="12" fill="#5b6573" text-anchor="start">AI governor</text><rect x="366.6" y="520" width="14" height="12" fill="#d9622b" rx="2"/><text x="386.6" y="530" font-size="12" fill="#5b6573" text-anchor="start">Politician</text>
</svg>
